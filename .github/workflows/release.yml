name: Build AppImages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        include:
          - name: kde
            kde_flag: "ON"
            wlr_flag: "OFF"
          - name: wlr
            kde_flag: "OFF"
            wlr_flag: "ON"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            libgtk-4-dev \
            libgtk4-layer-shell-dev \
            libadwaita-1-dev \
            libcairo2-dev \
            libglib2.0-dev \
            libyaml-cpp-dev

      - name: Download linuxdeploy and plugins
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh
          sudo cp linuxdeploy-plugin-gtk.sh /usr/local/bin/linuxdeploy-plugin-gtk

      - name: Build project
        run: |
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=MinSizeRel \
                -DCMAKE_INSTALL_PREFIX=/usr \
                -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
                -DCMAKE_CXX_FLAGS="-Os -ffunction-sections -fdata-sections" \
                -DCMAKE_EXE_LINKER_FLAGS="-Wl,--gc-sections" \
                -DENABLE_KDE_SCREENSHOT=${{ matrix.kde_flag }} \
                -DENABLE_WLR_SCREENCOPY=${{ matrix.wlr_flag }} ..
          make -j$(nproc)
          DESTDIR=../AppDir make install

      - name: Create AppImage
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          export DEPLOY_GTK_VERSION=4
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file assets/ds-measurer.desktop \
            --icon assets/ds-measurer.svg \
            --plugin gtk \
            --output appimage
          mv ds-measurer-x86_64.AppImage "ds-measurer-${VERSION}-${{ matrix.name }}-x86_64.AppImage"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ds-measurer-*-${{ matrix.name }}-x86_64.AppImage
