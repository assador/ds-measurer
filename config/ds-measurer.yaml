common:
   show diagonal: yes
   copy format: "{w} × {h} / {l}\n{a}°\n[{x1}, {y1}]\n[{x2}, {y2}]"
guides:
   snap distance: 10
screenshot:
   target: both
   format: png
   file:   "~/screenshot_%Y_%m_%d_%H_%M_%S.png"
shortcuts:
   clear all:        j
   clear last:       BackSpace
   clear:            Delete
   copy values:      space
   fixed ratio:      Shift_L
   freeze:           f
   from center:      Control_L
   guide horizontal: bracketleft
   guide vertical:   bracketright
   only mask:        question
   quit:             Escape
   relax:            grave
   reset ratio:      backslash
   screenshot:       s
   select:           Tab
   show guides:      g
   snap to guides:   p
   toggle diagonal:  z
   toggle mode:      m
aspect ratio shortcuts:
   q: "1"
   w: "4 / 3"
   e: "(1 + sqrt(5)) / 2"
   r: "3 / 2"
   t: "16 / 9"
   y: "sqrt(2)"
selection guides:
   x: { x: [ 0.5                ], y: [ 0.5                ], show: yes }
   c: { x: [ 0.38197, 0.61803   ], y: [ 0.38197, 0.61803   ], show: no }
   v: { x: [ 0.33333, 0.66667   ], y: [ 0.33333, 0.66667   ], show: no }
   b: { x: [ 0.2, 0.4, 0.6, 0.8 ], y: [ 0.2, 0.4, 0.6, 0.8 ], show: no }
colors shortcuts:
   default: 1
   dark:    2
   white:   3
   black:   4
   matrix:  5
colors:
   default:
      main:       { r: 0,    g: 0.5,  b: 1,    a: 0.5  }
      basic:      { r: 0,    g: 0,    b: 0,    a: 0.25 }
      guide:      { r: 0,    g: 0,    b: 0,    a: 0.15 }
      highlight:  { r: 0,    g: 0.5,  b: 1,    a: 1    }
      text main:  { r: 0,    g: 0.5,  b: 1,    a: 0.6  }
      text basic: { r: 0,    g: 0,    b: 0,    a: 0.75 }
      text faded: { r: 0,    g: 0,    b: 0,    a: 0.4  }
   dark:
      main:       { r: 0.2,  g: 0.6,  b: 1,    a: 0.5  }
      basic:      { r: 1,    g: 1,    b: 1,    a: 0.25 }
      guide:      { r: 1,    g: 1,    b: 1,    a: 0.15 }
      highlight:  { r: 0.2,  g: 0.6,  b: 1,    a: 1    }
      text main:  { r: 0.2,  g: 0.6,  b: 1,    a: 0.6  }
      text basic: { r: 1,    g: 1,    b: 1,    a: 0.75 }
      text faded: { r: 1,    g: 1,    b: 1,    a: 0.4  }
   white:
      main:       { r: 1,    g: 1,    b: 1,    a: 0.8  }
      basic:      { r: 1,    g: 1,    b: 1,    a: 0.5  }
      guide:      { r: 1,    g: 1,    b: 1,    a: 0.3  }
