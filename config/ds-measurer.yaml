      guide:      { r: 0,    g: 1,    b: 0,    a: 0.3  }
      highlight:  { r: 0,    g: 1,    b: 0,    a: 0.8  }
      text main:  { r: 0,    g: 1,    b: 0,    a: 0.9  }
