common:
   copy format: "{w} × {h} / {l}\n{a}°\n[{x1}, {y1}]\n[{x2}, {y2}]"
   font family: Sans
   font size: 12
   show diagonal: yes
guides:
   snap distance: 10
pick color:
   target: clipboard  # both | clipboard | stack
screenshot:
   target: clipboard  # both | clipboard | file
   file:   "~/screenshot_%Y_%m_%d_%H_%M_%S.png"
shortcuts:
   clear all:              j
   clear last:             BackSpace
   clear:                  Delete
   pick color:             d
   copy values:            space
   fixed ratio:            Shift_L
   freeze:                 f
   from center:            Control_L
   guide horizontal:       bracketleft
   guide vertical:         bracketright
   only mask:              question
   quit:                   Escape
   relax:                  grave
   reset ratio:            backslash
   screenshot:             s
   select:                 Tab
   show guides:            g
   snap to guides:         p
   switch to colorpicks:   h
   switch to guides:       g
   switch to measurements: m
   toggle diagonal:        z
   toggle labels:          l
   toggle labels back:     semicolon
aspect ratio shortcuts:
   q: "1"
   w: "4 / 3"
   e: "(1 + sqrt(5)) / 2"
   r: "3 / 2"
   t: "16 / 9"
   y: "sqrt(2)"
selection guides:
   x: { x: [ 0.5                ], y: [ 0.5                ], show: yes }
   c: { x: [ 0.38197, 0.61803   ], y: [ 0.38197, 0.61803   ], show: no  }
   v: { x: [ 0.33333, 0.66667   ], y: [ 0.33333, 0.66667   ], show: no  }
   b: { x: [ 0.2, 0.4, 0.6, 0.8 ], y: [ 0.2, 0.4, 0.6, 0.8 ], show: no  }
colors shortcuts:
   default: 1
   dark:    2
   white:   3
   black:   4
   matrix:  5
colors:
   default:
      main:       { r: 0,    g: 0.4,  b: 1,    a: 0.5  }
      basic:      { r: 0,    g: 0,    b: 0,    a: 0.35 }
