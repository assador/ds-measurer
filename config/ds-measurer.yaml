      text back:  { r: 0.8,  g: 0.8,  b: 0.8,  a: 1    }
      text main:  { r: 0,    g: 0.4,  b: 1,    a: 0.6  }
      text basic: { r: 0,    g: 0,    b: 0,    a: 0.75 }
      text faded: { r: 0,    g: 0,    b: 0,    a: 0.4  }
